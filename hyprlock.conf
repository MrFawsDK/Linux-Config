# MrFaws / Grey Curiosity - Purple Mindset
# Hyprlock 0.9.x | Wallpaper installation handled by install.sh

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/faws/.config/hypr/wallpapers/mrfaws-purple-hacker.png
    blur_passes = 0
    brightness = 0.92
    color = rgba(101016ff)
}

# Small heading / muted purple accent
label {
    monitor =
    text = MRFAWS  /  SECURE SESSION
    color = rgba(b7a1d9ff)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 72, 214
    halign = left
    valign = center
}

# Main clock; keep it left of the hacker artwork
label {
    monitor =
    text = $TIME
    color = rgba(f2eff7ff)
    font_size = 112
    font_family = JetBrainsMono Nerd Font
    position = 62, 80
    halign = left
    valign = center
}

# Actual date, refreshed every minute
label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B %Y'
    color = rgba(bbb5c9ff)
    font_size = 19
    font_family = JetBrainsMono Nerd Font
    position = 72, -17
    halign = left
    valign = center
}

# User indicator
label {
    monitor =
    text = $USER  /  AUTHENTICATION REQUIRED
    color = rgba(b7a1d9ff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 72, -108
    halign = left
    valign = center
}

# One understated password field, no giant card
input-field {
    monitor =
    size = 355, 54
    outline_thickness = 1
    rounding = 13
    dots_size = 0.22
    dots_spacing = 0.24
    dots_center = false
    outer_color = rgba(9f8ac2cc)
    inner_color = rgba(171821df)
    font_color = rgba(f5f2ffff)
    check_color = rgba(a5c8b5ff)
    fail_color = rgba(d17c99ff)
    placeholder_text = Password to unlock
    fail_text = Authentication failed ($ATTEMPTS)
    fade_on_empty = false
    position = 72, -172
    halign = left
    valign = center
}

# Signature, tucked quietly at the bottom-left
label {
    monitor =
    text = grey curiosity  /  purple mindset
    color = rgba(b7a1d9ff)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 72, 89
    halign = left
    valign = bottom
}

label {
    monitor =
    text = ARCH LINUX  //  HYPRLAND
    color = rgba(888397ff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 72, 58
    halign = left
    valign = bottom
}
